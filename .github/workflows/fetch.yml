name: YouTube Comment Auto Fetcher (manual fallback)

# メタ情報収集は meta-fetch.yml (YouTube Data API v3) が Actions 上で定期実行する。
# youtube_archiver_with_comments_github.py はチャット取得専用 (yt-dlp)。
# cookie 必須の処理のため run_and_push.ps1 でローカル定期実行するのが基本だが、
# このワークフローで Actions 上からも手動実行できる (ローカルPCが使えない時用)。
# データセンターIPは YouTube に bot 判定されやすいため、使う場合は
# Secret YT_COOKIES の設定を推奨。
on:
  workflow_dispatch:

permissions:
  contents: write   # push するために必要

# 同時実行を防ぐ (前回のジョブが長引いても二重取得しない)
concurrency:
  group: yt-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # yt-dlp / chat-downloader は YouTube 側変更に追随するため常に最新を入れる
          pip install --upgrade -r requirements.txt

      # bot 判定対策: Secret YT_COOKIES があれば cookies.txt を生成し、
      # 次ステップの Python に YT_COOKIES_FILE として渡す。未設定なら cookie なしで実行。
      - name: Prepare cookies (if provided)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s\n' "$YT_COOKIES" > cookies.txt
            echo "YT_COOKIES_FILE=cookies.txt" >> "$GITHUB_ENV"
            echo "cookies.txt を作成しました ($(wc -l < cookies.txt) 行)"
          else
            echo "YT_COOKIES secret 未設定 → cookie なしで実行"
          fi

      - name: Run YouTube archiver
        env:
          GITHUB_ACTIONS: "true"
        run: python youtube_archiver_with_comments_github.py

      - name: Commit and push updates
        run: |
          rm -f cookies.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update archives and comments [skip ci]" || echo "No changes"
          git pull --rebase
          git push
