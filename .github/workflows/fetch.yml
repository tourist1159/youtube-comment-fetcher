name: YouTube Comment Auto Fetcher

on:
  schedule:
    # 毎時0分に実行
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # push するために必要

# 同時実行を防ぐ (前回のジョブが長引いても二重取得しない)
concurrency:
  group: yt-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # yt-dlp / chat-downloader は YouTube 側変更に追随するため常に最新を入れる
          pip install --upgrade -r requirements.txt

      - name: Run YouTube archiver
        env:
          GITHUB_ACTIONS: "true"
          # bot 判定で失敗する場合は、cookies を Secrets(YT_COOKIES) に入れて下の2行を有効化する:
          # YT_COOKIES_FILE: cookies.txt
        run: |
          # echo "${{ secrets.YT_COOKIES }}" > cookies.txt
          python youtube_archiver_with_comments_github.py

      - name: Commit and push updates
        run: |
          rm -f cookies.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update archives and comments [skip ci]" || echo "No changes"
          git push
